name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Supersede a pull request's older runs, but never a push to main: those
  # builds produce the installer, and cancelling one throws the artifact away.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The platform this fork exists for. windows-2022, not windows-latest:
  # latest is Server 2025, which ships no Visual Studio, and npm compiles any
  # package carrying a binding.gyp whether or not it ships a prebuilt binary.
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Package the installer
        run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: edith-windows-installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30

  # Kept so a change here, or a merge from the macOS repo, cannot quietly break
  # that platform. No native rebuild and no Python for the same reason as the
  # Windows job: the database module is N-API, so its shipped binary loads as
  # it is. That step used to sit here for twenty-five minutes and then time out.
  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
