name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The platform this fork exists for. windows-2022, not windows-latest:
  # latest is Server 2025, which ships no Visual Studio, and npm compiles any
  # package carrying a binding.gyp whether or not it ships a prebuilt binary.
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build native modules for Electron
        run: npx electron-builder install-app-deps
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Package the installer
        run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: edith-windows-installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30

  # Kept so a change here, or a merge from the macOS repo, cannot quietly break
  # that platform. Python 3.11 because the native module's build tooling still
  # imports distutils, which 3.12 removed.
  macos:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npx electron-builder install-app-deps
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
